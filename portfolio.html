<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Design Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <style>
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Hover scale effect for images */
        .hover-scale:hover {
            transform: translateY(-10px) scale(1.05);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">
    <!-- Header -->
    <header class="bg-gray-800 shadow-md p-4 flex flex-col items-center">
        <a href="index.html" class="flex items-center mb-2">
            <img src="assets/img/AB-2.png" alt="Logo" class="h-12 w-12">
            <h1 class="text-2xl font-bold text-gray-100 ml-2">Brand Design</h1>
        </a>
    </header>

    <!-- Tabs -->
    <nav class="bg-gray-700 shadow-md">
        <div class="container mx-auto flex justify-center space-x-4 border-b border-gray-600">
            <button data-tab="posters" class="tab-button px-4 py-2 text-gray-200 hover:text-white border-b-4 border-transparent transition duration-300">
                Posters
            </button>
            <button data-tab="webdesign" class="tab-button px-4 py-2 text-gray-200 hover:text-white border-b-4 border-transparent transition duration-300">
                Logos
            </button>
            <button data-tab="printdesign" class="tab-button px-4 py-2 text-gray-200 hover:text-white border-b-4 border-transparent transition duration-300">
                Print Design
            </button>
            <button data-tab="illustrations" class="tab-button px-4 py-2 text-gray-200 hover:text-white border-b-4 border-transparent transition duration-300">
                Illustrations
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto p-6">
        <!-- Posters Section -->
        <section id="posters" class="tab-content fade-in block">
            <h2 class="text-3xl font-semibold mb-4 text-gray-100">Posters</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <img src="/assets/img/webp/product%20ad.webp" alt="Branding Work" class="rounded shadow-lg hover-scale">
                <img src="/assets/img/webp/testimonial.webp" alt="Branding Work" class="rounded shadow-lg hover-scale">
                <img src="/assets/img/webp/KCY%20Social%20Sunday.webp" alt="Branding Work" class="rounded shadow-lg hover-scale">
                <img src="/assets/img/webp/Abiemi%20Design3.webp" alt="Branding Work" class="rounded shadow-lg hover-scale">
                <img src="/assets/img/webp/Kucasa%20rally%201.webp" alt="Branding Work" class="rounded shadow-lg hover-scale">
                <img src="/assets/img/webp/AB%20New.webp" alt="Branding Work" class="rounded shadow-lg hover-scale">
            </div>
        </section>

        <!-- Other Sections -->
        <section id="webdesign" class="tab-content hidden fade-in">
            <h2 class="text-3xl font-semibold mb-4 text-gray-100">Logos</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <img src="/assets/img/logo webp/Silhouette.webp" alt="Branding Work" class="rounded shadow-lg hover-scale">
                <img src="/assets/img/logo webp/pris logo eggplant.webp" alt="Branding Work" class="rounded shadow-lg hover-scale">
                <img src="/assets/img/logo webp/RVOP Logo.webp" alt="Branding Work" class="rounded shadow-lg hover-scale">
                <img src="/assets/img/logo webp/concept 2.webp" alt="Branding Work" class="rounded shadow-lg hover-scale">
                <img src="/assets/img/logo webp/v3.webp" alt="Branding Work" class="rounded shadow-lg hover-scale">
                <img src="/assets/img/logo webp/rvp.webp" alt="Branding Work" class="rounded shadow-lg hover-scale">
            </div>
        </section>
        <section id="printdesign" class="tab-content hidden fade-in">
            <h2 class="text-3xl font-semibold mb-4 text-gray-100">Print Design</h2>
            <p class="text-gray-400">Uploading...</p>
        </section>
        <section id="illustrations" class="tab-content hidden fade-in">
            <h2 class="text-3xl font-semibold mb-4 text-gray-100">Illustrations</h2>
            <p class="text-gray-400">Uploading...</p>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tabButtons = document.querySelectorAll(".tab-button");
            const tabContents = document.querySelectorAll(".tab-content");

            tabButtons.forEach((button, index) => {
                button.addEventListener("click", () => {
                    // Reset all buttons and hide all sections
                    tabButtons.forEach(btn => {
                        btn.classList.remove("border-gray-100", "text-white");
                        btn.classList.add("text-gray-200", "border-transparent");
                    });
                    tabContents.forEach(content => content.classList.add("hidden"));

                    // Activate clicked tab and show corresponding section
                    button.classList.remove("text-gray-200", "border-transparent");
                    button.classList.add("border-gray-100", "text-white");
                    const targetTab = button.getAttribute("data-tab");
                    document.getElementById(targetTab).classList.remove("hidden");
                });

                // Set the first tab as active on load
                if (index === 0) {
                    button.classList.add("border-gray-100", "text-white");
                }
            });
        });
    </script>
</body>
</html>
